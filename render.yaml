services:
  - type: web
    name: icanuz-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OWNER_CHAT_ID
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: ADMIN_CONTACT
        sync: false
      - key: AI_ENABLED
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
